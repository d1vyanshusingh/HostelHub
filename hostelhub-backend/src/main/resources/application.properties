spring.application.name=hostelhub-backend

# ===============================================
# MySQL Database Configuration
# ===============================================
spring.datasource.url=jdbc:mysql://localhost:3306/hostelhub_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
